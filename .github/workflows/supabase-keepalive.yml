name: Supabase keep-alive

# Free Supabase projects pause after 7 days without activity.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase variables not set; skipping."
            exit 0
          fi
          # The bare /rest/v1/ schema endpoint now returns 401 for publishable keys,
          # so query a real table instead. anon has no grants, so a 401/403 here is
          # still a live answer from Postgres; only 000/404/5xx mean the project is down.
          code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/shared_workspaces?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          case "$code" in
            2??|401|403) exit 0 ;;
            *) echo "Supabase did not respond normally (paused or unreachable?)"; exit 1 ;;
          esac
