services:
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # Live-mount the source so edits on the host reload in the container.
      - .:/app
      # Keep the container's node_modules separate from the Windows host's.
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # file watching works on Windows bind mounts
    restart: unless-stopped

volumes:
  node_modules:
